#cloud-config
package_update: true
packages:
  - python3
  - python3-venv
  - ufw
users:
  - default
  - name: lab
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/systemd/system/dropbox-lab.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Benign Dropbox heartbeat lab gateway
      Wants=network-online.target
      After=network-online.target
      StartLimitIntervalSec=300
      StartLimitBurst=3
      [Service]
      Type=simple
      User=lab
      Group=lab
      WorkingDirectory=/opt/dropbox-lab
      EnvironmentFile=/etc/dropbox-lab/config
      LoadCredential=dropbox_token:/etc/dropbox-lab/token
      ExecStart=/opt/dropbox-lab/.venv/bin/python lab_app.py --node node-b --run-id ${LAB_RUN_ID} --state /var/lib/dropbox-lab/worker.sqlite --heartbeats 0 --duration 86400 --poll 2
      Restart=on-failure
      RestartSec=10
      StateDirectory=dropbox-lab
      StateDirectoryMode=0700
      UMask=0077
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/dropbox-lab
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [mkdir, -p, /opt/dropbox-lab, /etc/dropbox-lab]
  - [chmod, '0700', /etc/dropbox-lab]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, '22/tcp']
  - [ufw, --force, enable]
  - [systemctl, daemon-reload]
